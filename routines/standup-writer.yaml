name: standup-writer
description: "Generate daily standup from git activity and cast.db sessions (dispatches standup-writer via researcher+docs)"
trigger:
  type: cron
  value: "0 8 * * 1-5"    # weekdays 8am
agent: researcher
prompt_template: |
  Generate a standup summary for today. Query cast.db for agent_runs from the last 24 hours.
  Run git log --since=yesterday --oneline across active repos. Format as: Yesterday / Today / Blockers.
  Write to routines-output/standup-writer/YYYY-MM-DD-HHmm.md.
output_dir: "~/.claude/routines-output/standup-writer"
enabled: true
