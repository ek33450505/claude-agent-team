name: task-triage
description: "Daily task triage — surfaces BLOCKED/overdue items from cast.db"
trigger:
  type: cron
  value: "0 8 * * *"
agent: researcher
prompt_template: |
  Query cast.db for any agent_runs with status BLOCKED from the last 48 hours.
  Summarize priorities for today.
  Write markdown report to routines-output/task-triage/.
output_dir: "~/.claude/routines-output/task-triage"
enabled: true
notes: "cast.db-only — surfaces BLOCKED/overdue agent_runs from the last 48 hours."
