name: Bug Report
description: Report a bug or unexpected behavior in CAST
labels: [bug]
title: "[Bug] "
body:
  - type: input
    id: cast-version
    attributes:
      label: CAST Version
      description: Run `cast --version` to get this
      placeholder: "e.g. 7.3.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options: [macOS, Ubuntu, Other Linux]
    validations:
      required: true
  - type: input
    id: bash-version
    attributes:
      label: Bash Version
      description: Run `bash --version | head -1`
      placeholder: "e.g. GNU bash, version 5.2.26"
  - type: input
    id: claude-version
    attributes:
      label: Claude Code Version
      placeholder: "e.g. 1.2.3"
  - type: dropdown
    id: component
    attributes:
      label: CAST Component Affected
      options:
        - cast-audit-hook.sh
        - cast-budget-alert.sh
        - cast-cwdchanged-hook.sh
        - cast-session-start-hook.sh
        - cast-subagent-stop-hook.sh
        - cast-user-prompt-hook.sh
        - cast-stop-failure-hook.sh
        - cast-events.sh
        - bin/cast (CLI)
        - install.sh
        - agent (specify in description)
        - other
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear description of what went wrong
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `cast ...`
        2. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste from `~/.claude/logs/hook-errors.log` or terminal output
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional Context
