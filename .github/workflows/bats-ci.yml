name: BATS Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install bats-core and dependencies
        run: |
          sudo apt-get update
          # sqlite3 and xxd are no-ops on GitHub-hosted runners (preinstalled) but required for act/ci-local parity
          sudo apt-get install -y bats python3-yaml sqlite3 xxd
      - name: Set up CAST runtime dirs
        run: |
          mkdir -p ~/.claude/scripts ~/.claude/logs ~/.claude/cast/events ~/.claude/agent-status
          cp scripts/*.sh ~/.claude/scripts/
          cp scripts/*.py ~/.claude/scripts/
          chmod +x ~/.claude/scripts/*.sh
      - name: Run BATS tests
        run: bats tests/*.bats tests/hooks/*.bats tests/agents/*.bats tests/scripts/*.bats tests/skills/*.bats --tap

  contract-test:
    needs: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install bats-core and sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y bats sqlite3
      - name: Set up CAST runtime dirs
        run: |
          mkdir -p ~/.claude/scripts ~/.claude/logs ~/.claude/cast/events ~/.claude/agent-status
          cp scripts/*.sh ~/.claude/scripts/
          cp scripts/*.py ~/.claude/scripts/
          chmod +x ~/.claude/scripts/*.sh
      - name: Run contract tests
        # NOTE: contract-test enforcement is not yet enabled — only a subset of the 23 agents have
        # fixtures wired up, so the job runs advisory-only (|| true + continue-on-error).
        # Re-enabling enforcement requires full fixture coverage first; this job currently provides no enforcement signal.
        run: bash scripts/cast-contract-runner.sh commit 2>/dev/null || true
        continue-on-error: true

  hook-contract-validation:
    needs: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up CAST runtime dirs
        run: |
          mkdir -p ~/.claude/scripts ~/.claude/logs ~/.claude/cast/events ~/.claude/agent-status
          cp scripts/*.sh ~/.claude/scripts/
          cp scripts/*.py ~/.claude/scripts/
          chmod +x ~/.claude/scripts/*.sh
      - name: Validate hook output contracts
        run: bash scripts/cast-validate-all-hooks.sh --source
