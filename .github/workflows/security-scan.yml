name: Security Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          submodules: recursive

      - name: Run PII tree scan
        run: bash scripts/ci-pii-scan.sh

      - name: Verify scanner detects fakes (self-test)
        run: bash scripts/ci-pii-scan.sh --self-test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y shellcheck

      - name: ShellCheck scripts
        run: |
          shellcheck --severity=error scripts/*.sh
          shellcheck --severity=error .githooks/pre-commit
          shellcheck --severity=error .githooks/pre-push
          shellcheck --severity=error install.sh

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Install ruff
        # Pinned: unpinned `pip install ruff` floats to latest; ruff 0.16.0
        # enabled new default rules (EXE001/I001/S110) not covered by ruff.toml's
        # ignore-list baseline, turning the gate red repo-wide. Bump deliberately
        # (and fix/ignore the new rules) rather than tracking every ruff release.
        run: pip install ruff==0.15.14

      - name: Lint Python scripts
        run: ruff check scripts/*.py
