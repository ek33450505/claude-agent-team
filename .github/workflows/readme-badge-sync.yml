name: Sync README Badges & Heal Stats

# REQUIRES MANUAL REPO SETTING:
#   Settings → Actions → General → Workflow permissions:
#   "Allow GitHub Actions to create and approve pull requests" must be CHECKED.
# Without this, the `gh pr create` step in this workflow fails with:
#   "GitHub Actions is not permitted to create or approve pull requests"
# This is a one-time toggle per repo. See PR #29 follow-up.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Update badges
        run: bash scripts/gen-stats.sh

      - name: Check for badge changes
        id: changes
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR if badges changed
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync README badges"
          title: "chore: sync README badges"
          body: |
            Automated badge sync from `scripts/gen-stats.sh`.

            Branch protection on `main` requires PRs, so this workflow opens a PR instead of
            pushing directly. Auto-merge after CI green is safe — the change is docs-only.
          branch: chore/sync-readme-badges
          delete-branch: true
          base: main
          labels: |
            automated
            docs

  heal-cast-stats:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check for stats drift
        id: drift
        run: |
          # Use --check mode to detect drift; ignores 'updated' field to avoid
          # daily churn commits. Exit code 0 = in sync, non-zero = drift detected.
          if bash scripts/gen-cast-stats.sh --check 2>/dev/null; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate and push heal if drifted
        if: steps.drift.outputs.drifted == 'true'
        run: |
          # Regenerate the file
          bash scripts/gen-cast-stats.sh

          # Configure git bot identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage and commit
          git add cast-stats.json
          git commit -m "chore: regenerate cast-stats.json"

          # Sync with main before push to handle concurrent pushes (e.g., sync-badges)
          git pull --rebase origin main

          # Push the heal commit
          git push
