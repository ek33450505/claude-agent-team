name: Sync README Badges & Heal Stats

# REQUIRES MANUAL REPO SETTING:
#   Settings → Actions → General → Workflow permissions:
#   "Allow GitHub Actions to create and approve pull requests" must be CHECKED.
# Without this, the `gh pr create` step in this workflow fails with:
#   "GitHub Actions is not permitted to create or approve pull requests"
# This is a one-time toggle per repo. See PR #29 follow-up.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Update badges
        run: bash scripts/gen-stats.sh

      - name: Check for badge changes
        id: changes
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR if badges changed
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync README badges"
          title: "chore: sync README badges"
          body: |
            Automated badge sync from `scripts/gen-stats.sh`.

            Branch protection on `main` requires PRs, so this workflow opens a PR instead of
            pushing directly. Auto-merge after CI green is safe — the change is docs-only.
          branch: chore/sync-readme-badges
          delete-branch: true
          base: main
          labels: |
            automated
            docs

  heal-cast-stats:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Check for stats drift
        id: drift
        run: |
          # Use --check mode to detect drift; ignores 'updated' field to avoid
          # daily churn commits. Exit code 0 = in sync, non-zero = drift detected.
          if bash scripts/gen-cast-stats.sh --check 2>/dev/null; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate stats if drifted
        if: steps.drift.outputs.drifted == 'true'
        run: bash scripts/gen-cast-stats.sh

      - name: Open PR to heal stats drift
        if: steps.drift.outputs.drifted == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: heal cast-stats.json drift"
          title: "chore: heal cast-stats.json drift"
          body: |
            Automated cast-stats.json self-heal.

            Main branch detected stats drift; regenerated from `scripts/gen-cast-stats.sh`.

            **Note:** PRs created by GitHub Actions do not trigger CI workflows on the PR itself.
            This is acceptable for the 1-file generated artifact. The heal PR replaces the old
            direct push which branch protection (GH013) now rejects.
          branch: chore/heal-cast-stats
          delete-branch: true
          base: main
          labels: |
            automated

      - name: Auto-merge heal PR or squash on fallback
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pull-request-number }}"

          # Attempt auto-merge first (requires --auto flag and branch protection configured)
          if gh pr merge "$PR_NUMBER" --auto --squash 2>/dev/null; then
            echo "✓ Heal PR auto-merge queued"
            exit 0
          fi

          # Fallback: immediate squash-merge (if auto-merge not available)
          if gh pr merge "$PR_NUMBER" --squash 2>/dev/null; then
            echo "✓ Heal PR squash-merged (auto-merge not available)"
            exit 0
          fi

          # Both failed: log loudly but exit cleanly
          # The open PR is itself a heal signal; human review is acceptable for corner cases
          echo "⚠ Auto-merge and squash both unavailable. Heal PR remains open for review."
          echo "   PR #$PR_NUMBER: chore/heal-cast-stats → main"
          exit 0

  heal-ecosystem-versions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Ensure jq is available
        run: which jq || sudo apt-get install -y jq

      - name: Check for ecosystem-versions drift
        id: drift
        run: |
          # Use --remote --check to detect drift against live sibling repos.
          # Exit code 0 = in sync, non-zero = drift detected.
          if bash scripts/gen-ecosystem-versions.sh --remote --check 2>/dev/null; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate ecosystem-versions if drifted
        if: steps.drift.outputs.drifted == 'true'
        run: bash scripts/gen-ecosystem-versions.sh --remote

      - name: Open PR to heal ecosystem-versions drift
        if: steps.drift.outputs.drifted == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: heal ecosystem-versions.json drift"
          title: "chore: heal ecosystem-versions.json drift"
          body: |
            Automated ecosystem-versions.json self-heal.

            Main branch detected version drift; regenerated from `scripts/gen-ecosystem-versions.sh --remote`.

            **Note:** PRs created by GitHub Actions do not trigger CI workflows on the PR itself.
            This is acceptable for the 1-file generated artifact. The heal PR replaces the old
            direct push which branch protection (GH013) now rejects.
          branch: chore/heal-ecosystem-versions
          delete-branch: true
          base: main
          labels: |
            automated

      - name: Auto-merge heal PR or squash on fallback
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pull-request-number }}"

          # Attempt auto-merge first (requires --auto flag and branch protection configured)
          if gh pr merge "$PR_NUMBER" --auto --squash 2>/dev/null; then
            echo "✓ Heal PR auto-merge queued"
            exit 0
          fi

          # Fallback: immediate squash-merge (if auto-merge not available)
          if gh pr merge "$PR_NUMBER" --squash 2>/dev/null; then
            echo "✓ Heal PR squash-merged (auto-merge not available)"
            exit 0
          fi

          # Both failed: log loudly but exit cleanly
          # The open PR is itself a heal signal; human review is acceptable for corner cases
          echo "⚠ Auto-merge and squash both unavailable. Heal PR remains open for review."
          echo "   PR #$PR_NUMBER: chore/heal-ecosystem-versions → main"
          exit 0
