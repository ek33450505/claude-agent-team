name: Python Unit Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Run python unit tests (stdlib unittest discover)
        # Gates all tests/test_*.py (db-contract checker, redaction, SQL-injection,
        # db-connect pragma). stdlib-only — system python3 on ubuntu-latest, no setup-python.
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
