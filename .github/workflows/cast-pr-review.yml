# NOTE: [HUMAN ACTION REQUIRED] Remove "CAST PR Review" from required status checks in GitHub branch protection settings.
# This workflow is advisory only and runs after BATS tests pass via workflow_run trigger.

name: CAST PR Review

on:
  workflow_run:
    workflows: ["BATS Tests"]
    types: [completed]

jobs:
  cast-review:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the changed files in this PR. Focus on:
            1. BATS test coverage for any new shell scripts
            2. Hook script defensive coding (empty input handling, exit codes)
            3. Agent frontmatter completeness (name, model, effort, memory fields)
            Post findings as a PR comment. Be specific — cite file:line.
