# This workflow is advisory only and runs after BATS tests pass via workflow_run trigger.

name: CAST PR Review

on:
  workflow_run:
    workflows: ["BATS Tests"]
    types: [completed]

jobs:
  cast-review:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: anthropics/claude-code-action@70a6e5256e9e2366a1ed5c041904a982ba3a328f # v1.0.1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the changed files in this PR. Focus on:
            1. BATS test coverage for any new shell scripts
            2. Hook script defensive coding (empty input handling, exit codes)
            3. Agent frontmatter completeness (name, model, memory fields; effort only when model is opus-tier)
            Post findings as a PR comment. Be specific — cite file:line.
