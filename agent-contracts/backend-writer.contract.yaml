agent: backend-writer
version: "1.0"
assertions:
  - type: output_contains
    pattern: "Status: (DONE|DONE_WITH_CONCERNS|BLOCKED|NEEDS_CONTEXT)"
  - type: output_contains
    pattern: "## Work Log"
  - type: output_contains
    pattern: "Files changed:"
  - type: cast_db_write
    table: agent_runs
    field: agent_name
    expected: backend-writer
fixtures:
  - name: "basic implementation"
    input: "Add a /health route to the Express server that returns 200 with body 'ok'"
    expected_status: DONE
