# Model options:
#   Claude API:  claude-opus-4-6, claude-sonnet-4-6, claude-haiku-4-5
#   Ollama:      ollama:codellama, ollama:deepseek-coder, ollama:llama3
#   LiteLLM handles routing — Ollama models run locally (free, private)
#   Use Claude for code-writing/planning, Ollama for reviews/commits

name: research-team
description: "Parallel research on multiple facets of a topic, then synthesis"

teammates:
  - role: researcher-a
    agent_def: researcher
    model: claude-sonnet-4-6
    task: "Investigate the technical implementation aspects of the research topic. Focus on: existing solutions, technical approaches, implementation patterns, trade-offs. Write findings to ~/.claude/reports/research-<swarm_id>-technical.md"
    read_only: true

  - role: researcher-b
    agent_def: researcher
    model: claude-sonnet-4-6
    task: "Investigate the ecosystem and prior art aspects of the research topic. Focus on: existing tools, community adoption, comparisons, lessons learned from similar projects. Write findings to ~/.claude/reports/research-<swarm_id>-ecosystem.md"
    read_only: true

  - role: synthesizer
    agent_def: researcher
    model: claude-sonnet-4-6
    task: "Read the findings from researcher-a and researcher-b in ~/.claude/reports/. Synthesize into a unified recommendation document at ~/.claude/reports/research-<swarm_id>-synthesis.md. Include: executive summary, key findings, recommended approach, open questions."
    read_only: true

quality_gates:
  require_reviewer: false
  commit_agent_only: false
  pre_merge_review: false

merge_strategy: none
