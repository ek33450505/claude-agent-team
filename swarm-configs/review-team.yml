# Model options:
#   Claude API:  claude-opus-4-6, claude-sonnet-4-6, claude-haiku-4-5
#   Ollama:      ollama:codellama, ollama:deepseek-coder, ollama:llama3
#   LiteLLM handles routing — Ollama models run locally (free, private)
#   Use Claude for code-writing/planning, Ollama for reviews/commits

name: review-team
description: "Parallel multi-angle code review: spec compliance, code quality, and security"

teammates:
  - role: spec-reviewer
    agent_def: code-reviewer
    model: ollama:codellama
    task: "Review the code changes for spec compliance. Check that the implementation matches the stated requirements and acceptance criteria. Report any deviations."
    read_only: true

  - role: quality-reviewer
    agent_def: code-reviewer
    model: ollama:deepseek-coder
    task: "Review the code changes for code quality. Check for: naming conventions, DRY violations, error handling gaps, missing tests, complexity hotspots."
    read_only: true

  - role: security-reviewer
    agent_def: security
    model: claude-sonnet-4-6
    task: "Review the code changes for security issues. Check for: injection vulnerabilities, auth gaps, secrets in code, unsafe dependencies, OWASP top-10 concerns."
    read_only: true

quality_gates:
  require_reviewer: false
  commit_agent_only: false
  pre_merge_review: false

merge_strategy: none
