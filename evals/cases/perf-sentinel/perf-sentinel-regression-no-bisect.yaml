# corpus: F24 — perf-sentinel identified a benchmark regression but returned the report without a git bisect start command.
id: perf-sentinel-regression-no-bisect
version: "1"
agent: perf-sentinel
description: "perf-sentinel must include an exact 'git bisect start' command in every regression report; a regression reported without a bisect target cannot be acted on (F24)"
corpus_source: manual
failure_type: missing_bisect_target
cost_tier: cheap
tags: [perf-sentinel, regression, bisect, missing-bisect-target, F24, phase-a]

trigger: |
  Analyze the following benchmark results for regressions and produce a Performance Report.

  Baseline (recorded at commit a1b2c3d, 2026-06-10):
  ```
  cast-db-write      1.2 ms avg   (1000 runs)
  cast-memory-query  0.8 ms avg   (1000 runs)
  cast-route-lookup  0.3 ms avg   (1000 runs)
  ```

  Current results (HEAD = f7e6d5c, 2026-06-13):
  ```
  cast-db-write      1.9 ms avg   (1000 runs)
  cast-memory-query  0.9 ms avg   (1000 runs)
  cast-route-lookup  0.3 ms avg   (1000 runs)
  ```

  Recent commits between baseline and HEAD:
  - f7e6d5c  2026-06-13  Add connection pooling to cast_db.py
  - e4c3b2a  2026-06-12  Refactor cast-memory-router.py to support prefix-match
  - d1f0e9b  2026-06-11  Add retry logic to db_write wrapper
  - c8a7b6d  2026-06-10  Bump SQLite journal_mode to WAL

  Generate a Performance Report following your standard format. Flag any regressions
  (>10% slower than baseline) and provide exact git bisect commands to isolate the culprit.

expected_behaviors:
  - "Response identifies cast-db-write as a regression (1.2 ms → 1.9 ms, approximately +58%)"
  - "Response includes an exact 'git bisect start' command with bad and good refs"
  - "Response includes a benchmark command for 'git bisect run' that exits 1 on regression"
  - "Response names a likely culprit commit from the provided git log"

forbidden_behaviors:
  - "Response reports the cast-db-write regression but provides no git bisect command"
  - "Response omits regression metrics (percentage change) and relies only on prose description"
  - "Response lists likely culprit commits without providing the bisect start invocation"

graders:
  - id: bisect-start-command-present
    type: programmatic
    command: "grep -qE 'git bisect start' '{output_file}'"
    pass_criteria: exit_code_0
    on_error: error

  - id: regression-metric-present
    type: programmatic
    command: "grep -qiE '\\+[0-9]+%|[0-9]+% slower|regression' '{output_file}'"
    pass_criteria: exit_code_0
    on_error: error
